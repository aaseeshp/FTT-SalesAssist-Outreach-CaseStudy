<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6579"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b45b8"/></marker>
    <style>
      .t{font-size:13px;font-weight:600;fill:#152033}
      .s{font-size:11px;fill:#5a6579}
      .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#5a6579}
      .rule{fill:#e6effc;stroke:#1d5fc4;stroke-width:1.3}
      .agent{fill:#efe9fa;stroke:#6b45b8;stroke-width:1.3}
      .ui{fill:#12233f}
      .mcp{fill:#fff;stroke:#6b45b8;stroke-width:1.3;stroke-dasharray:5 3}
      .data{fill:#f1f3f7;stroke:#9aa4b5;stroke-width:1.2}
      .band{fill:#fafbfd;stroke:#d9dee7}
      .ln{stroke:#5a6579;stroke-width:1.4;fill:none}
      .lp{stroke:#6b45b8;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="40" y="38" style="font-size:20px;font-weight:700;fill:#152033">SalesAssist Outreach Assist - architecture</text>
  <text x="40" y="58" class="s">Rules decide what is true and allowed. Agents decide priority and wording. The deterministic claim checker has the final say.</text>
  <g transform="translate(900,28)">
    <rect x="0" y="0" width="14" height="14" class="rule"/><text x="20" y="11" class="s">Deterministic rules</text>
    <rect x="140" y="0" width="14" height="14" class="agent"/><text x="160" y="11" class="s">LLM agents (CrewAI)</text>
    <rect x="0" y="22" width="14" height="14" class="mcp"/><text x="20" y="33" class="s">MCP server (stdio)</text>
    <rect x="140" y="22" width="14" height="14" class="data"/><text x="160" y="33" class="s">Source data</text>
  </g>

  <!-- UI -->
  <rect x="40" y="80" width="1200" height="96" rx="10" class="ui"/>
  <text x="60" y="104" style="font-size:12px;font-weight:700;letter-spacing:.08em;fill:#9fb3d6">SALESASSIST UI · light HTML/JS</text>
  <g font-size="12">
    <rect x="60" y="116" width="230" height="46" rx="8" fill="#1d3358"/><text x="74" y="135" fill="#fff" font-weight="600">CRM advisor list</text><text x="74" y="151" fill="#b9c7e2" font-size="11">region-scoped · signal chips · ✉ icon</text>
    <rect x="310" y="116" width="300" height="46" rx="8" fill="#1d3358"/><text x="324" y="135" fill="#fff" font-weight="600">Email dialog</text><text x="324" y="151" fill="#b9c7e2" font-size="11">intent tabs · subject · body · data links · tone</text>
    <rect x="630" y="116" width="290" height="46" rx="8" fill="#1d3358"/><text x="644" y="135" fill="#fff" font-weight="600">Summary box</text><text x="644" y="151" fill="#b9c7e2" font-size="11">why · facts (toggle) · left out · snapshot · trace</text>
    <rect x="940" y="116" width="280" height="46" rx="8" fill="#1d3358"/><text x="954" y="135" fill="#fff" font-weight="600">Admin actions + confirmation</text><text x="954" y="151" fill="#b9c7e2" font-size="11">select one or many → confirm → run</text>
  </g>

  <!-- API -->
  <path d="M175,176 V206" class="ln" marker-end="url(#a)"/>
  <text x="184" y="198" class="s">GET /api/outreach/{advisor} (email icon)</text>
  <path d="M1080,206 V176" class="ln" marker-end="url(#a)"/>
  <text x="900" y="198" class="s">POST /api/actions/execute (confirmed)</text>

  <rect x="40" y="206" width="1200" height="260" rx="10" class="band"/>
  <text x="60" y="230" class="h">FASTAPI · OUTREACH PIPELINE (app/pipeline.py)</text>
  <rect x="1010" y="216" width="214" height="26" rx="6" fill="#fff" stroke="#d9dee7"/>
  <text x="1022" y="233" class="s">Cache per user·advisor·data version</text>

  <!-- steps -->
  <g>
    <rect x="60" y="250" width="140" height="72" rx="8" class="rule"/><text x="72" y="270" class="t">1 Access guard</text><text x="72" y="288" class="s">user region =</text><text x="72" y="302" class="s">advisor region</text>
    <rect x="215" y="250" width="150" height="72" rx="8" class="rule"/><text x="227" y="270" class="t">2 Assemble</text><text x="227" y="288" class="s">6 sources in parallel</text><text x="227" y="302" class="s">share-class resolution</text>
    <rect x="380" y="250" width="150" height="72" rx="8" class="rule"/><text x="392" y="270" class="t">3 Signal engine</text><text x="392" y="288" class="s">pluggable detectors</text><text x="392" y="302" class="s">+ evidence ids</text>
    <rect x="545" y="250" width="170" height="72" rx="8" class="agent"/><text x="557" y="270" class="t">4 Classify intent</text><text x="557" y="288" class="s">Intent Analyst agent</text><text x="557" y="302" class="s">→ reconciled vs. rules</text>
    <rect x="730" y="250" width="160" height="72" rx="8" class="rule"/><text x="742" y="270" class="t">5 Evidence guard</text><text x="742" y="288" class="s">fact pack · exclusions</text><text x="742" y="302" class="s">gaps · admin actions</text>
    <rect x="905" y="250" width="170" height="72" rx="8" class="agent"/><text x="917" y="270" class="t">6 Compose</text><text x="917" y="288" class="s">Writer ∥ Admin Ops</text><text x="917" y="302" class="s">→ Compliance Reviewer</text>
    <rect x="1090" y="250" width="134" height="72" rx="8" class="rule"/><text x="1102" y="270" class="t">7 Claim check</text><text x="1102" y="288" class="s">numbers · links</text><text x="1102" y="302" class="s">funds · disclosure</text>
    <path d="M200,286 H213" class="ln" marker-end="url(#a)"/><path d="M365,286 H378" class="ln" marker-end="url(#a)"/><path d="M530,286 H543" class="ln" marker-end="url(#a)"/>
    <path d="M715,286 H728" class="ln" marker-end="url(#a)"/><path d="M890,286 H903" class="ln" marker-end="url(#a)"/><path d="M1075,286 H1088" class="ln" marker-end="url(#a)"/>
  </g>
  <text x="60" y="346" class="s">Fallbacks: agent intent unsupported by a rule signal → rejected · agents fail → single model call → template · draft fails claim check → rule-based draft shown</text>

  <!-- agents -->
  <rect x="60" y="362" width="1164" height="90" rx="8" fill="#fff" stroke="#e1d8f3"/>
  <text x="76" y="382" class="h" style="fill:#6b45b8">CREWAI AGENTS (app/agents/crew.py, prompts.py)</text>
  <g>
    <rect x="76" y="392" width="220" height="48" rx="8" class="agent"/><text x="88" y="411" class="t">Advisor Intent Analyst</text><text x="88" y="428" class="s">tools: crm, book</text>
    <rect x="312" y="392" width="200" height="48" rx="8" class="agent"/><text x="324" y="411" class="t">Outreach Writer</text><text x="324" y="428" class="s">no tools · fact pack only</text>
    <rect x="528" y="392" width="200" height="48" rx="8" class="agent"/><text x="540" y="411" class="t">Admin Operations</text><text x="540" y="428" class="s">tools: admin (read-only)</text>
    <rect x="744" y="392" width="220" height="48" rx="8" class="agent"/><text x="756" y="411" class="t">Compliance Reviewer</text><text x="756" y="428" class="s">reviews Writer output</text>
    <rect x="980" y="392" width="230" height="48" rx="8" fill="#fff" stroke="#6b45b8"/><text x="992" y="411" class="t">LLM chain</text><text x="992" y="428" class="s">Claude Sonnet 5.5 → Haiku 5.5 · or Gemini</text>
  </g>

  <!-- MCP -->
  <rect x="40" y="490" width="1200" height="120" rx="10" class="band"/>
  <text x="60" y="514" class="h">SALESASSIST CAPABILITIES AS MCP SERVERS (app/mcp_servers) · user id injected by host, never by the model</text>
  <g>
    <rect x="60" y="528" width="280" height="66" rx="8" class="mcp"/><text x="74" y="548" class="t">salesassist-crm</text><text x="74" y="565" class="s">get_advisor_profile · get_crm_activities</text><text x="74" y="580" class="s">get_outreach_signals</text>
    <rect x="356" y="528" width="270" height="66" rx="8" class="mcp"/><text x="370" y="548" class="t">salesassist-book</text><text x="370" y="565" class="s">get_recent_sales · get_holdings</text><text x="370" y="580" class="s">(with "not proof of trade" caveats)</text>
    <rect x="642" y="528" width="290" height="66" rx="8" class="mcp"/><text x="656" y="548" class="t">salesassist-content</text><text x="656" y="565" class="s">find_shareable_material (compliance-filtered)</text><text x="656" y="580" class="s">get_fund_reference (+ disclosure)</text>
    <rect x="948" y="528" width="276" height="66" rx="8" class="mcp"/><text x="962" y="548" class="t">salesassist-admin</text><text x="962" y="565" class="s">propose_meeting_slots</text><text x="962" y="580" class="s">list_admin_capabilities</text>
  </g>
  <path d="M186,440 V526" class="lp" marker-end="url(#p)"/><path d="M260,440 C260,500 470,490 470,526" class="lp" marker-end="url(#p)"/>
  <path d="M628,440 C628,500 1080,490 1080,526" class="lp" marker-end="url(#p)"/>

  <!-- Data -->
  <rect x="40" y="636" width="1200" height="128" rx="10" class="band"/>
  <text x="60" y="660" class="h">SOURCES (DataSource interface → JSON adapter today; CRM / ledger / holdings / fund feed / DAM in production)</text>
  <g>
    <rect x="60" y="676" width="180" height="70" rx="8" class="data"/><text x="72" y="696" class="t">Advisors + users</text><text x="72" y="713" class="s">region, firm, notes</text><text x="72" y="728" class="s">00_context · 01_advisors</text>
    <rect x="256" y="676" width="180" height="70" rx="8" class="data"/><text x="268" y="696" class="t">CRM activities</text><text x="268" y="713" class="s">requests, promises</text><text x="268" y="728" class="s">02_activities</text>
    <rect x="452" y="676" width="180" height="70" rx="8" class="data"/><text x="464" y="696" class="t">Holdings</text><text x="464" y="713" class="s">dated snapshot</text><text x="464" y="728" class="s">03_holdings</text>
    <rect x="648" y="676" width="180" height="70" rx="8" class="data"/><text x="660" y="696" class="t">Recent sales</text><text x="660" y="713" class="s">trade evidence</text><text x="660" y="728" class="s">04_recent_sales</text>
    <rect x="844" y="676" width="180" height="70" rx="8" class="data"/><text x="856" y="696" class="t">Fund reference</text><text x="856" y="713" class="s">licensed, dated</text><text x="856" y="728" class="s">05_fund_reference</text>
    <rect x="1040" y="676" width="184" height="70" rx="8" class="data"/><text x="1052" y="696" class="t">Product documents</text><text x="1052" y="713" class="s">audience, approval, class</text><text x="1052" y="728" class="s">06_documents</text>
  </g>
  <path d="M640,612 V634" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M290,322 C290,470 30,470 30,700 H58" class="ln" marker-end="url(#a)"/>
  <text x="34" y="480" class="s" transform="rotate(-90 34 480)">direct read (rules)</text>
</svg>
